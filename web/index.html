<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>人群指挥官</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#c2ddf4;
    font-family:ui-sans-serif,system-ui,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    user-select:none;touch-action:none}
  canvas{display:block;width:100%;height:100%}

  #hud{position:fixed;left:20px;top:16px;color:#16283a;pointer-events:none}
  #countWrap{display:flex;align-items:baseline;gap:6px;line-height:1}
  #count{font-size:60px;font-weight:800;letter-spacing:-.02em;
    text-shadow:0 3px 0 rgba(255,255,255,.85),0 6px 18px rgba(20,50,80,.18);
    transform-origin:left bottom;transition:transform .12s cubic-bezier(.3,1.6,.6,1)}
  #count.pop{transform:scale(1.16)}
  .unit{font-size:18px;font-weight:700;color:#4a6b86}
  #meta{margin-top:5px;font-size:13px;font-weight:600;color:#4a6b86;
    background:rgba(255,255,255,.72);padding:3px 10px;border-radius:999px;display:inline-block}
  #meta b{color:#1d3550}

  #buffs{margin-top:8px;display:flex;gap:8px}
  .badge{font-size:12px;font-weight:800;padding:4px 11px;border-radius:999px;color:#fff;
    letter-spacing:.02em;box-shadow:0 3px 10px rgba(20,50,80,.18);transition:opacity .25s,transform .25s}
  .badge.hide{opacity:0;transform:translateY(-4px)}
  .badge b{font-weight:900}
  #wep{background:linear-gradient(180deg,#ffb43c,#e8850f)}
  #shl{background:linear-gradient(180deg,#57c8ff,#1e8fd0)}

  #bossbar{position:fixed;left:50%;top:22px;transform:translateX(-50%);
    width:min(420px,64vw);height:16px;border-radius:999px;background:rgba(20,35,52,.55);
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.35),0 6px 18px rgba(20,40,60,.3);
    overflow:hidden;transition:opacity .3s}
  #bossbar.hide{opacity:0}
  #bossfill{height:100%;width:100%;border-radius:999px;
    background:linear-gradient(180deg,#ff6b52,#c0190b);transition:width .12s linear}
  #bossname{position:absolute;left:0;right:0;top:-19px;text-align:center;
    font-size:11px;font-weight:800;color:#7a1a10;letter-spacing:.16em;
    text-shadow:0 1px 0 rgba(255,255,255,.7)}

  #hint{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
    font-size:13px;font-weight:600;color:#3d5a72;background:rgba(255,255,255,.72);
    padding:7px 16px;border-radius:999px;pointer-events:none;transition:opacity .6s ease}

  #flash{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:5;background:#ffb060;
    transition:opacity .35s ease-out}

  /* ---------- 整备界面 ---------- */
  #loadout{position:fixed;inset:0;display:grid;place-items:center;z-index:20;
    background:rgba(16,34,52,.52);backdrop-filter:blur(4px)}
  #loadout.hide{display:none}
  .lo-card{width:min(880px,92vw);background:#fff;border-radius:26px;padding:26px 30px 24px;
    box-shadow:0 30px 80px rgba(8,26,44,.45);animation:loIn .3s cubic-bezier(.2,1.3,.5,1)}
  @keyframes loIn{from{transform:translateY(14px) scale(.96);opacity:0}to{transform:none;opacity:1}}

  .lo-top{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
  .lo-lv{font-size:26px;font-weight:900;color:#16283a;letter-spacing:.01em}
  .lo-count{font-size:14px;font-weight:700;color:#5d7b95}
  .lo-count b{font-size:30px;color:#1c5fd4;font-weight:900;margin-right:4px}
  .lo-note{margin-top:2px;font-size:13px;font-weight:700;color:#0f9d58}

  .lo-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0 14px}
  .opt{position:relative;border:2px solid #e3ecf4;background:#f8fbfe;border-radius:18px;
    padding:16px 14px 14px;cursor:pointer;font-family:inherit;text-align:left;
    transition:transform .1s,border-color .15s,box-shadow .15s}
  .opt:hover{border-color:#b9d4ee;transform:translateY(-2px);box-shadow:0 10px 24px rgba(30,70,110,.12)}
  .opt:active{transform:translateY(1px)}
  .opt.disabled{opacity:.42;pointer-events:none;filter:grayscale(.7)}
  .opt-ico{display:inline-flex;align-items:center;justify-content:center;
    width:38px;height:38px;border-radius:12px;color:#fff;font-weight:900;font-size:17px;margin-bottom:10px}
  .opt-name{display:block;font-size:17px;font-weight:900;color:#16283a}
  .opt-desc{display:block;margin-top:4px;font-size:12.5px;font-weight:600;color:#5d7b95;line-height:1.45;min-height:36px}
  .opt-cost{display:inline-block;margin-top:10px;font-size:12px;font-weight:900;
    padding:3px 10px;border-radius:999px;background:#ffe6e6;color:#c02525}
  .opt-gain{display:inline-block;margin-top:10px;margin-left:6px;font-size:12px;font-weight:900;
    padding:3px 10px;border-radius:999px;background:#e3f7ec;color:#0f9d58}

  .lo-skip{width:100%;border:0;border-radius:16px;padding:15px;font-size:16px;font-weight:900;
    color:#fff;background:#2f6ee0;cursor:pointer;font-family:inherit;
    box-shadow:0 5px 0 #1f4a9e;transition:transform .08s,box-shadow .08s}
  .lo-skip:active{transform:translateY(4px);box-shadow:0 1px 0 #1f4a9e}

  /* ---------- 结算 ---------- */
  #overlay{position:fixed;inset:0;display:grid;place-items:center;
    background:rgba(18,38,58,.45);backdrop-filter:blur(3px);z-index:10}
  #overlay.hide{display:none}
  .card{background:#fff;border-radius:22px;padding:34px 46px;text-align:center;
    box-shadow:0 24px 60px rgba(10,30,50,.35);animation:in .28s cubic-bezier(.2,1.4,.5,1)}
  @keyframes in{from{transform:scale(.86);opacity:0}to{transform:scale(1);opacity:1}}
  .card h1{margin:0 0 6px;font-size:34px;color:#16283a}
  .card p{margin:0 0 22px;font-size:14px;color:#5d7b95;font-weight:600}
  .card button{border:0;border-radius:14px;padding:13px 38px;font-size:16px;font-weight:800;
    color:#fff;background:#2f6ee0;cursor:pointer;font-family:inherit;
    box-shadow:0 6px 0 #1f4a9e;transition:transform .08s,box-shadow .08s}
  .card button:active{transform:translateY(4px);box-shadow:0 2px 0 #1f4a9e}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="flash"></div>

<div id="hud">
  <div id="countWrap"><span id="count">5</span><span class="unit">人</span></div>
  <div id="meta">第 <b id="lv">1</b> 关 · 敌军 <b id="foes">0</b></div>
  <div id="buffs">
    <span id="wep" class="badge hide">普通步枪</span>
    <span id="shl" class="badge hide">护盾 <b>0</b></span>
  </div>
</div>

<div id="bossbar" class="hide"><span id="bossname">首领</span><div id="bossfill"></div></div>

<div id="hint">左右拖动 / ← → 抢门：数字是兵力，盾和武器是强化</div>

<div id="loadout" class="hide">
  <div class="lo-card">
    <div class="lo-top">
      <div class="lo-lv" id="loLv">第 1 关</div>
      <div class="lo-count"><b id="loCount">5</b>人</div>
    </div>
    <div class="lo-note" id="loNote"></div>
    <div class="lo-opts" id="loOpts"></div>
    <button class="lo-skip" id="loSkip">不换，直接开打</button>
  </div>
</div>

<div id="overlay" class="hide">
  <div class="card">
    <h1 id="ovTitle">胜利</h1>
    <p id="ovSub"></p>
    <button id="ovBtn">继续</button>
  </div>
</div>

<script>
  window.addEventListener('error', function (e) {
    document.title = 'JS_ERROR: ' + e.message + ' @ ' +
      String(e.filename || '').split('/').pop() + ':' + e.lineno;
  });
</script>
<script src="three.min.js"></script>
<script src="js/units.js"></script>
<script src="js/game.js"></script>
</body>
</html>
